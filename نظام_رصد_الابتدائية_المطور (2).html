function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem(KEY,JSON.stringify(db));$('saveState').textContent='✓ حفظ تلقائي'}function enterApp(){$('welcome').classList.add('hidden');$('app').classList.remove('hidden');home()}function nav(fn){history.push({page:current?'class':'home',id:current?.id,w:week});future=[];fn()}

document.querySelectorAll('[data-logo]').forEach(i=>i.src=LOGO);(()=>{let l=document.createElement('link');l.rel='icon';l.href=LOGO;document.head.appendChild(l)})();
const GRADES=['الصف الأول الابتدائي','الصف الثاني الابتدائي','الصف الثالث الابتدائي','الصف الرابع الابتدائي','الصف الخامس الابتدائي','الصف السادس الابتدائي'],SUBJECTS=['اللغة العربية','اللغة الإنجليزية','الرياضيات','العلوم','الدراسات الاجتماعية','التربية الدينية','الحاسب الآلي','التربية الفنية','التربية الموسيقية','التربية الرياضية'];
function classForm(){modal(`<h2>➕ إنشاء فصل دراسي</h2><div class="grid"><label class="field">اسم الفصل<input id="cname" placeholder="مثال: 6A"></label><label class="field">الصف الدراسي<input id="cgrade" list="dlGrades" placeholder="اختر أو اكتب"></label><label class="field">المادة<input id="subject" list="dlSubjects" placeholder="اختر أو اكتب" value="اللغة العربية"></label></div><datalist id="dlGrades">${GRADES.map(g=>`<option value="${g}">`).join('')}</datalist><datalist id="dlSubjects">${SUBJECTS.map(g=>`<option value="${g}">`).join('')}</datalist><div class="field" style="margin-top:10px">بيانات الطلاب — اسم في كل سطر أو استيراد من ملف<div class="actions"><button class="btn gold" type="button" onclick="pickNames()">📥 استيراد من Excel / Word / TXT / CSV</button><span id="nmCount" class="muted">0 طالب</span></div><textarea id="names" rows="9" oninput="nmCnt()" placeholder="يمكن اللصق مباشرة أو الاستيراد ثم المراجعة والتعديل قبل الإنشاء"></textarea></div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="createClass()">إنشاء الفصل</button><button class="btn" onclick="closeModal()">إلغاء</button></div>`)}
function nmCnt(){$('nmCount').textContent=$('names').value.split(/\r?\n/).filter(x=>x.trim()).length+' طالب'}
async function extractNames(file){let rows;if(/\.docx$/i.test(file.name)){let m=await loadJs('https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js','mammoth');rows=(await m.extractRawText({arrayBuffer:await file.arrayBuffer()})).value.split(/\r?\n/).map(v=>[v])}else if(/\.txt$/i.test(file.name))rows=(await file.text()).split(/\r?\n/).map(v=>[v]);else{let X=await loadJs('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','XLSX'),wb=X.read(await file.arrayBuffer(),{type:'array'});rows=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false})}return parseNames(rows)}
function parseNames(rows){const cl=v=>String(v??'').replace(/\u0640/g,'').replace(/\s+/g,' ').trim(),isH=v=>/^(الاسم|اسم الطالب|اسم التلميذ|اسم الطالبة|اسم)$/.test(cl(v));let hr=-1,hc=-1;rows.slice(0,15).forEach((r,i)=>{if(hr<0)r.forEach((v,j)=>{if(hr<0&&isH(v)){hr=i;hc=j}})});let n=hr>=0?rows.slice(hr+1).map(r=>cl(r[hc])):rows.map(r=>cl(r.find(v=>/[\u0600-\u06ff]/.test(String(v)))));return[...new Set(n.map(x=>x.replace(/^\d+\s*[-.)]\s*/,'')).filter(v=>v.length>2&&/[\u0600-\u06ffA-Za-z]/.test(v)))]}
function pickNames(){let f=document.createElement('input');f.type='file';f.accept='.xlsx,.xls,.csv,.docx,.txt';f.onchange=async()=>{if(!f.files[0])return;try{let n=await extractNames(f.files[0]),t=$('names'),old=t.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);t.value=[...new Set([...old,...n])].join('\n');nmCnt();if(!n.length)alert('لم يتم العثور على أسماء في الملف')}catch(e){alert('تعذر قراءة الملف. جرّب XLSX أو DOCX أو TXT. '+e.message)}};f.click()}
function createClass(){let name=$('cname').value.trim(),grade=$('cgrade').value.trim(),subject=$('subject').value.trim();if(!name||!grade||!subject)return alert('أدخل اسم الفصل والصف الدراسي والمادة');let students=$('names').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map((n,i)=>({id:'s'+Date.now()+i,name:n,exam1:null,exam2:null,weeks:Array.from({length:WEEKS},()=>({abs:[0,0,0,0,0],homework:null,notebook:null,evaluation:null}))}));let c={id:'c'+Date.now(),name,grade,subject,students};db.classes.push(c);save();closeModal();openClass(c.id)}
mig();home();
</script></body></html>
