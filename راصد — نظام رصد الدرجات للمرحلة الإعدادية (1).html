<script>
const $=i=>document.getElementById(i),uid=()=>{const a=new Uint32Array(2);crypto.getRandomValues(a);return a[0].toString(36)+a[1].toString(36)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AR='٠١٢٣٤٥٦٧٨٩',ar=s=>String(s).replace(/\d/g,d=>AR[d]).replace(/\./g,'٫'),en=s=>String(s).replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/[٫,،]/g,'.').trim();
const r2=v=>Math.round(v*100)/100,fm=v=>v==null?'':v==='غ'?'غ':ar(r2(v)),mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const CFG={a3:'غ',a2:4,a1:7,hmin:5,hi:10,lo:8},acy=()=>{const d=new Date(),y=d.getFullYear()-(d.getMonth()<7?1:0);return ar(y)+' / '+ar(y+1)},MAX={t:20,h:10,x:15},PS=24,WK=['الأول','الثاني','الثالث','الرابع'],KEY='rasd-v3',XM='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
/* ---- calculations ---- */
const cell=(r,w,f)=>r&&r.w&&r.w[w]&&r.w[w][f]!=null?r.w[w][f]:null;
const dys=(r,w)=>r&&r.w&&r.w[w]&&Array.isArray(r.w[w].d)?r.w[w].d:[0,0,0,0];
const ab=(r,w)=>dys(r,w).filter(Boolean).length;
function beh(r,w){const a=ab(r,w);if(a>=3)return CFG.a3;if(a==2)return CFG.a2;if(a==1)return CFG.a1;const h=cell(r,w,'h');return h==null?null:h>CFG.hmin?CFG.hi:CFG.lo}
const wv=(r,w,f)=>f=='s'?beh(r,w):cell(r,w,f),n0=v=>v==='غ'?0:v;
function tot(r,f){let s=0;for(let w=0;w<4;w++){const v=wv(r,w,f);if(v==null)return null;s+=n0(v)}return s}
const av=(r,f)=>{const t=tot(r,f);return t==null?null:t/4},avs=r=>{const a=['t','h','s'].map(f=>av(r,f));return a.some(v=>v==null)?null:a[0]+a[1]+a[2]};
const pgs=n=>{const p=[];for(let i=0;i<Math.max(n,1);i+=PS)p.push([i,Math.min(n,i+PS)]);return p};
function parseNames(t){return String(t).split(/\r?\n/).map(l=>{let c=l.split('\t').map(x=>x.trim()).filter(x=>/\p{L}/u.test(x));let n=c.length?c.sort((a,b)=>b.length-a.length)[0]:l;return n.replace(/^[\s\d٠-٩\-.)(]+/,'').replace(/[\s\d٠-٩]+$/,'').replace(/\s+/g,' ').trim()}).filter(x=>/\p{L}/u.test(x))}
/* ---- state & saving ---- */
const SAFE=/^[\w-]{1,32}$/,sid=x=>SAFE.test(x)&&x!=='__proto__'?x:uid(),num=(v,m)=>typeof v==='number'&&isFinite(v)&&v>=0&&v<=m?v:null;
const crec=r=>({w:[0,1,2,3].map(i=>{const q=r&&r.w&&r.w[i]||{};return{t:num(q.t,MAX.t),h:num(q.h,MAX.h),d:[0,1,2,3].map(k=>Array.isArray(q.d)&&q.d[k]?1:0)}}),x:num(r&&r.x,MAX.x)});
function cleanClass(c){if(!c||typeof c!=='object')return null;const seen=new Set(),u=x=>{let i=sid(x);while(seen.has(i))i=uid();seen.add(i);return i};
 const students=(Array.isArray(c.students)?c.students:[]).filter(s=>s&&typeof s.name==='string').map(s=>({id:u(s.id),name:s.name.slice(0,100)}));
 const months=(Array.isArray(c.months)?c.months:[]).filter(m=>m&&typeof m==='object').map(m=>{const data={};students.forEach(s=>{if(m.data&&Object.prototype.hasOwnProperty.call(m.data,s.id))data[s.id]=crec(m.data[s.id])});return{id:sid(m.id),name:String(m.name||'شهر').slice(0,40),data}});
 if(!months.length)months.push({id:uid(),name:'الشهر الأول',data:{}});
 const o={id:sid(c.id),students,months};['name','subject','teacher','term','year'].forEach(k=>o[k]=String(c[k]??'').slice(0,100));return o}
let S;try{const raw=localStorage.getItem(KEY);try{S=JSON.parse(raw)}catch(e){if(raw)localStorage.setItem(KEY+'-corrupt-'+Date.now(),raw)}}catch(e){}
if(!S||!Array.isArray(S.classes))S={v:3,school:{dir:'',adm:'',name:'',en:''},classes:[],ui:{},dirty:0,lastBackup:0};
S.classes=S.classes.map(cleanClass).filter(Boolean);const U=S.ui=S.ui||{};U.scr=U.scr||'home';U.sc=U.sc||1;
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
let sT;function flush(){clearTimeout(sT);try{localStorage.setItem(KEY,JSON.stringify(S));$('sv').textContent='✓ تم الحفظ'}catch(e){$('sv').textContent='⚠ تعذر الحفظ، نزّل نسخة احتياطية'}}
function save(d){if(d){if(!S.dirty)S.since=Date.now();S.dirty=(S.dirty||0)+1;const k=U.cid||'_';S.dc=S.dc||{};S.dc[k]=(S.dc[k]||0)+1}clearTimeout(sT);sT=setTimeout(flush,300);bnr()}
const ALL=()=>S.classes.map(c=>c.id).concat('_');
function marked(ids){S.dc=S.dc||{};ids.forEach(i=>delete S.dc[i]);S.dirty=Object.values(S.dc).reduce((a,b)=>a+b,0);if(!S.dirty)S.lastBackup=Date.now();save()}
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
function bnr(){const b=$('bn'),n=S.dirty||0,need=n>=20||(n>0&&Date.now()-(S.lastBackup||S.since||Date.now())>6048e5);b.hidden=!need;if(need)b.innerHTML='<span>لديك '+ar(n)+' تعديل لم يُحفظ في نسخة احتياطية.</span><button class="b p" data-a="bkall">نزّل نسخة JSON الآن</button>'}
const cls=()=>S.classes.find(c=>c.id===U.cid),mon=()=>{const c=cls();return c&&(c.months.find(m=>m.id===U.mid)||c.months[0])};
const rc=(m,id)=>m.data[id]||(m.data[id]={w:[0,1,2,3].map(()=>({t:null,h:null,d:[0,0,0,0]})),x:null});
const UN=[];const push=(m,id)=>{UN.push([U.cid,m.id,id,JSON.stringify(m.data[id]||null)]);if(UN.length>200)UN.shift()};
/* ---- toast & modal ---- */
let tt;function toast(m,al,fn){const r=$('ts');r.innerHTML='<div><span>'+esc(m)+'</span>'+(al?'<button class="b">'+esc(al)+'</button>':'')+'</div>';if(al)r.querySelector('button').onclick=()=>{r.innerHTML='';fn()};clearTimeout(tt);tt=setTimeout(()=>r.innerHTML='',al?7000:2800)}
let lastF;function modal(h,mount){lastF=document.activeElement;const r=$('md');r.innerHTML='<div class="md"><div class="mb" role="dialog" aria-modal="true">'+h+'</div></div>';r.firstChild.onmousedown=e=>{if(e.target===r.firstChild)r.innerHTML=''};const f=r.querySelector('input,textarea,button');if(f)f.focus();if(mount)mount(r,()=>r.innerHTML='')}

function row(c,m,i,ed){const s=c.students[i],r=m.data[s.id]||null;
 let h='<tr><td>'+ar(i+1)+'</td><td class="nm">'+esc(s.name)+(ed?' <button class="b" data-a="rep" data-i="'+i+'">تقرير</button>':'')+'</td>';
 for(let w=0;w<4;w++){['t','h'].forEach((f,k)=>{const v=cell(r,w,f);h+=ed?'<td class="in"><input inputmode="decimal" aria-label="'+SUB[f]+' '+WK[w]+' — '+esc(s.name)+'" data-i="'+i+'" data-c="'+(w*2+k)+'" value="'+fm(v)+'"></td>':'<td>'+fm(v)+'</td>'});h+='<td class="cl">'+fm(beh(r,w))+'</td>'}
 for(let w=0;w<4;w++)dys(r,w).forEach((x,k)=>h+='<td class="dd'+(ed?' ed':'')+'"'+(ed?' tabindex="0" role="button" aria-label="غياب '+WK[w]+' يوم '+ar(k+1)+' — '+esc(s.name)+'" data-a="day" data-i="'+i+'" data-w="'+w+'" data-d="'+k+'"':'')+'>'+(x?'غ':'')+'</td>');
 h+=ed?'<td class="in"><input inputmode="decimal" aria-label="اختبار الشهر — '+esc(s.name)+'" data-i="'+i+'" data-c="8" value="'+fm(r&&r.x)+'"></td>':'<td>'+fm(r&&r.x)+'</td>';
 ['t','h','s'].forEach(f=>h+='<td class="cl">'+fm(av(r,f))+'</td>');return h+'<td class="cl"><b>'+fm(avs(r))+'</b></td></tr>'}
function tbl(c,m,a,b,ed){
 let h='<thead><tr><th rowspan="2">م</th><th rowspan="2">الاسم</th>';
 for(let w=0;w<4;w++)h+='<th colspan="3">التقييم '+WK[w]+'</th>';
 for(let w=0;w<4;w++)h+='<th colspan="4">غياب '+WK[w]+'</th>';

 const priorChange=$('fi').onchange;$('fi').onchange=async e=>{const f=e.target.files[0],mode=e.target.dataset.mode;e.target.value='';if(!f)return;if(mode==='data'||mode==='data-full'||mode==='data-names'||mode==='data-grades'||mode==='data-absence'){const scope=mode==='data-names'?'names':mode==='data-grades'?'grades':mode==='data-absence'?'absence':'full';return openImport(f,scope)}if(mode==='imp')return imp(f);if(mode==='names'){try{const X=await loadSheetLib(),wb=X.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=X.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});const n=parseNames(rows.map(r=>r.join('\t')).join('\n'));if(!n.length){toast('لم يتم العثور على أسماء');return}const t=$('c_names');if(t){t.value=n.join('\n');t.dispatchEvent(new Event('input'))}toast('تم استيراد '+ar(n.length)+' اسم')}catch(x){toast(x.message||'تعذر قراءة الملف')}return}};
 // Conditional formatting in the live grade grid.
 const cfCfg=()=>S.cf||(S.cf={high:85,mid:65});function paintRow(i){const tr=$('gr')&&$('gr').rows[i+1];if(!tr)return;const cfg=cfCfg();tr.querySelectorAll('td.in input').forEach(inp=>{const k=+inp.dataset.c,v=en(inp.value),td=inp.parentElement;td.classList.remove('cf-high','cf-mid','cf-low','cf-empty');if(v===''){td.classList.add('cf-empty');return}const n=Number(v),max=k===8?15:(k%2?10:20),ratio=n/max*100;if(ratio>=cfg.high)td.classList.add('cf-high');else if(ratio>=cfg.mid)td.classList.add('cf-mid');else td.classList.add('cf-low')})}const oldRrow=rrow;rrow=function(i){oldRrow(i);paintRow(i)};const baseRender=render;render=function(){baseRender();if(U.scr==='class'&&cls())cls().students.forEach((_,i)=>paintRow(i))};
 // Add audit report to menu without removing existing options.
 const oldMenu=A.menu;A.menu=()=>{oldMenu();const box=$('md').querySelector('.mb');if(box){const b=document.createElement('button');b.className='b';b.style.cssText='width:100%;margin-bottom:.4rem;text-align:start';b.textContent='سجل الاستيراد والتعديلات';b.onclick=()=>{const logs=(S.audit||[]).slice().reverse();modal('<h3>سجل الاستيراد والتعديلات</h3><div class="imp-preview"><table><thead><tr><th>التاريخ</th><th>العملية</th><th>التفاصيل</th></tr></thead><tbody>'+logs.map(x=>'<tr><td>'+esc(new Date(x.at).toLocaleString('ar-EG'))+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.detail)+'</td></tr>').join('')+'</tbody></table></div><button class="b" data-a="mc">إغلاق</button>')};box.insertBefore(b,box.lastElementChild);const cf=document.createElement('button');cf.className='b';cf.style.cssText='width:100%;margin-bottom:.4rem;text-align:start';cf.textContent='إعدادات التنسيق الشرطي';cf.onclick=()=>{const q=cfCfg();modal('<h3>إعدادات التنسيق الشرطي</h3><p>تُحسب الحدود كنسبة من الدرجة النهائية لكل خانة.</p><div class="imp-grid"><label>بداية اللون الأخضر (%)<input id="cf-high" type="number" min=1 max=100 value="'+q.high+'"></label><label>بداية اللون الأصفر (%)<input id="cf-mid" type="number" min=0 max=99 value="'+q.mid+'"></label></div><div class="row"><button class="b p" id="cf-save">حفظ الإعدادات</button><button class="b" data-a="mc">إلغاء</button></div>',r=>{r.querySelector('#cf-save').onclick=()=>{const h=+r.querySelector('#cf-high').value,m=+r.querySelector('#cf-mid').value;if(!(h>m&&h<=100&&m>=0)){toast('يجب أن يكون حد الأخضر أكبر من الأصفر');return}S.cf={high:h,mid:m};audit('تعديل التنسيق الشرطي','الأخضر '+h+'%، الأصفر '+m+'%');save(1);$('md').innerHTML='';render();toast('تم حفظ قواعد التنسيق الشرطي')}})};box.insertBefore(cf,box.lastElementChild)}};
 // Track ordinary manual edits for audit history.
 const originalSetCell=setCell;setCell=function(t){const before=t.value,r=originalSetCell(t);if(r===2)audit('تعديل درجة',t.getAttribute('aria-label')+' = '+before);return r};
})();
 // Global page navigation: maintain a small in-session history of system screens.
 const pageHistory=[],futureHistory=[];let navSnapshot=null,navTravel=false;
 const pageState=()=>({scr:U.scr,cid:U.cid||null,mid:U.mid||null,tab:U.tab||null});
 const samePage=(a,b)=>a&&b&&a.scr===b.scr&&a.cid===b.cid&&a.mid===b.mid&&a.tab===b.tab;
 const originalRender=render;
 render=function(){const next=pageState();if(navSnapshot&&!samePage(navSnapshot,next)&&!navTravel){pageHistory.push(navSnapshot);if(pageHistory.length>80)pageHistory.shift();futureHistory.length=0}navTravel=false;navSnapshot=next;originalRender()};
 const restorePage=p=>{if(!p)return;navTravel=true;U.scr=p.scr;if(p.tab)U.tab=p.tab;if(p.cid)U.cid=p.cid;if(p.mid)U.mid=p.mid;else delete U.mid;save();render()};
 A.navhome=()=>{if(U.scr==='home')return;U.scr='home';save();render()};
 A.navback=()=>{if(!pageHistory.length){toast('لا توجد صفحة سابقة');return}const current=pageState();const prev=pageHistory.pop();futureHistory.push(current);restorePage(prev)};
 A.navforward=()=>{if(!futureHistory.length){toast('لا توجد صفحة تالية');return}const current=pageState();const next=futureHistory.pop();pageHistory.push(current);restorePage(next)};
/* ---- dashboard extensions: sidebar, transitions, actions ---- */
$('nv').innerHTML='<span id="ind"></span>'+TABS.map(([k,i,l])=>'<button class="nav" data-a="nav" data-k="'+k+'"><i>'+i+'</i>'+l+'</button>').join('');
function markNav(){const k=U.scr==='class'?U.tab:U.scr;let on=null;document.querySelectorAll('#nv .nav').forEach(b=>{const f=b.dataset.k===k;b.classList.toggle('on',f);if(f)on=b});const i=$('ind');if(!i)return;if(on){i.style.opacity=1;i.style.height=on.offsetHeight+'px';i.style.transform='translateY('+on.offsetTop+'px)'}else i.style.opacity=0}
function refresh(){const c=cls(),m=mon();if(!c||!m||U.scr!=='class'||!$('kp'))return;const st=stat(c,m);$('kp').innerHTML=kpis(c,m,st);$('sd').innerHTML=sidecol(c,m,st)}
rrow=function(i){const c=cls(),m=mon(),g=$('gr'),tr=g&&g.rows[i+1];if(!tr||!c||!m)return;const t=document.createElement('tbody');t.innerHTML='<tr>'+rowH(c,m,i)+'</tr>';const n=t.firstChild;[...tr.cells].forEach((td,k)=>{const x=n.cells[k];if(!x)return;td.className=x.className;if(!td.querySelector('input'))td.innerHTML=x.innerHTML});refresh()};
Object.assign(A,{
 nav:e=>{const k=e.dataset.k;if(k==='res')return A.res();if(k==='home'||k==='set'){U.scr=k;save();return render()}
  const c=cls()||(S.classes.length===1?S.classes[0]:null);if(!c){toast('اختر فصلًا من الرئيسية أولًا');U.scr='home';save();return render()}
  U.cid=c.id;if(!c.months.some(m=>m.id===U.mid))U.mid=c.months[c.months.length-1].id;if(k==='rep')return A.menu();if(k==='certs')return A.certs();if(k==='imp')return A.impm();U.scr='class';U.tab=k;save();render()},
 wk:e=>{U.wk=+e.dataset.w;save();render()},
 sel:e=>{U.sel=e.dataset.id;save();document.querySelectorAll('#gr tr.sel').forEach(r=>r.classList.remove('sel'));e.parentElement.classList.add('sel');refresh()},
 sv:()=>{flush();toast('✓ تم حفظ الرصد')},
 cfs:()=>{const h=+$('cfh').value,m=+$('cfm').value;if(!(h>m&&h<=100&&m>=0)){toast('يجب أن يكون حد الأخضر أكبر من الأصفر');return}S.cf={high:h,mid:m};save(1);render();toast('تم حفظ قواعد التلوين')},
 pal:e=>{U.pal=e.dataset.p;save();render()},
 certs:()=>{const c=cls();modal('<h3>🏅 الشهادات</h3><p>تُصدر شهادة لكل طالب اكتمل رصده في الشهر المختار، وتُطبع كل شهادة في صفحة مستقلة.</p><label class="f">الشهر<select id="cm">'+c.months.map(m=>'<option value="'+m.id+'"'+(m.id===U.mid?' selected':'')+'>'+esc(m.name)+'</option>').join('')+'</select></label><div class="row" style="margin-top:.7rem"><button class="b p" data-a="pcert" data-k="all">🖨️ طباعة شهادات الفصل</button><button class="b" data-a="pcert" data-k="top">🥇 المتميزون فقط</button><button class="b" data-a="mc">إغلاق</button></div>')},
 pcert:e=>{const c=cls(),m=c.months.find(x=>x.id===$('cm').value)||mon(),k=e.dataset.k,BG=['#d6f1de','#fff0b3','#ffdbe0'];const L=c.students.map(s=>{const r=m.data[s.id]||null,v=avs(r);return{s,r,v,x:r&&r.x!=null?r.x:null,l:lvl(v)}}).filter(o=>o.v!=null&&(k==='all'||o.l===0));if(!L.length){toast(k==='top'?'لا يوجد طلاب في مستوى ممتاز بهذا الشهر':'لا توجد درجات مكتملة لإصدار الشهادات');return}A.mc();
  doPrint(L.map(o=>{let q=0;for(let w=0;w<4;w++)q+=ab(o.r,w);return '<div class="pp cert">'+hdr('شهادة أداء ومتابعة')+'<p>تشهد المدرسة بأن الطالب/ـة</p><h2>'+esc(o.s.name)+'</h2><p>بفصل '+esc(c.name)+' — مادة '+esc(c.subject||'.........')+' — '+esc(m.name)+' — '+esc(c.term)+' للعام الدراسي '+esc(c.year)+'</p><table><thead><tr><th>تقييم /٢٠</th><th>واجب /١٠</th><th>سلوك /١٠</th><th>المتوسطات /٤٠</th><th>اختبار الشهر /١٥</th><th>المجموع /٥٥</th><th>أيام الغياب</th></tr></thead><tbody><tr><td>'+fm(av(o.r,'t'))+'</td><td>'+fm(av(o.r,'h'))+'</td><td>'+fm(av(o.r,'s'))+'</td><td><b>'+fm(o.v)+'</b></td><td>'+fm(o.x)+'</td><td><b>'+fm(o.x!=null?o.v+o.x:null)+'</b></td><td>'+ar(q)+'</td></tr></tbody></table><div class="big" style="background:'+BG[o.l]+';color:#000">التقدير: '+LV[o.l]+'</div><p>'+LD[o.l]+'</p>'+sig+'</div>'}).join(''))},thm:()=>$('th').click(),fmm:()=>$('fm').click(),fpp:()=>$('fp').click(),
 impm:()=>modal('<h3>📥 استيراد البيانات من Excel</h3><p>اختر نوع البيانات المطلوب. كل مسار مستقل ولا يغيّر الحقول الأخرى.</p><div class="row"><button class="b" data-a="xln">👥 استيراد أسماء الطلاب فقط</button><button class="b" data-a="xgr">📝 استيراد درجات التقييمات والاختبارات</button><button class="b" data-a="xab">📅 استيراد الغياب فقط</button><button class="b p" data-a="xlnfull">📊 استيراد شامل</button></div><div class="row"><button class="b" data-a="mc">إغلاق</button></div>')});
document.addEventListener('input',e=>{if(e.target.id==='q'){U.q=e.target.value;filt()}});
render();
